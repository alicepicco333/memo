[build]
  publish = "."

[[redirects]]
  from = "/ontology"
  to = "/meme_ontology.owl"
  status = 200

[[redirects]]
  from = "/ontology.ttl"
  to = "/meme_ontology.ttl"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/meme_ontology.owl"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/rdf+xml; charset=utf-8"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/meme_ontology.ttl"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "text/turtle; charset=utf-8"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/meme_data.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/color_data.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Self-hosted meme thumbnails (build_wall_thumbs.py, img/findings): a week in the browser cache
[[headers]]
  for = "/img/wall/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/img/findings/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/memes_lite.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/documentation.html"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
