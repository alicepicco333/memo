  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Meme Ontology</title>

</head>
<body class="home-page">

    <div class="topnav-links">
      <a class="topnav-link active" aria-current="page" href="index.html">Home</a>

  <div class="home-ticker" aria-hidden="true"><div class="home-ticker-track" id="home-ticker"></div></div>

  <main class="home-main">
    <section class="viz-section hero-section home-hero" id="sec-hero">
      <div id="hero-images" class="hero-images"></div>
      <div id="hero-collage-sentinel" class="home-collage-sentinel"></div>
      <div class="hero-content">
        <h1 class="hero-title"><span>THE MEME</span><span>ONTOLOGY</span></h1>
        <p class="hero-tagline">5,000 Know Your Meme entries, modelled as an OWL&nbsp;2 knowledge graph</p>
        <a class="hero-cta" href="visualizations.html">Explore the visualizations <span aria-hidden="true">→</span></a>
        <p class="hero-hover-hint">Hover any tile to read its RDF</p>
      </div>
      <div class="collage-sort" role="group" aria-label="Arrange the collage">
        <span class="collage-sort-title">Arrange</span>
        <button type="button" data-sort="shuffle" class="active" aria-pressed="true">Shuffle</button>
        <button type="button" data-sort="year" aria-pressed="false">Year</button>
        <button type="button" data-sort="colour" aria-pressed="false">Colour</button>
        <button type="button" data-sort="format" aria-pressed="false">Format</button>
      </div>
    </section>

  </main>

  <script>
    (function() {
      var heroContainer = document.getElementById('hero-images');
      var sentinel = document.getElementById('hero-collage-sentinel');
      var desktopHover = window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches;
      var turtleTip = null;
      var mousePos = { x: 0, y: 0 };
      var hasMousePos = false;
      var currentTile = null;
      var queue = [];
      var cursor = 0;
      var BATCH = 120;
      var isLoading = false;
      var exhausted = false;
      var allItems = [];
      var sortMode = 'shuffle';
      var lastGroupLabel = null;
      var colours = null;
      var sentinelObs = null;

      function toMemoLocal(str) {
        return String(str || '')
          .toLowerCase()
          .replace(/[^a-z0-9_-]+/g, '-')
          .replace(/-+/g, '-')
          .replace(/^-+|-+$/g, '') || 'memo_entry';
      }

      function shortText(str, maxLen) {
        var s = String(str || '').replace(/\s+/g, ' ').trim();
        if (s.length <= maxLen) return s;
        return s.slice(0, Math.max(0, maxLen - 1)) + '…';
      }

      function buildMemeSnippet(item) {
        var local = toMemoLocal(item.memoLocal || item.slug);
        var label = shortText(item.label || item.slug || 'Meme', 60);
        return [
          'memo:' + local + ' a owl:NamedIndividual, memo:MemeConcept ;',
          '  rdfs:label "' + label.replace(/"/g, '\\"') + '" .'
        ].join('\n');
      }

      function buildVariantSnippet(item) {
        var local = toMemoLocal(item.memoLocal || ('variant_' + (item.photoId || 'x')));
        var parent = toMemoLocal(item.parentLocal || item.slug || 'meme');
        var title = shortText(item.label || item.slug || 'Variant', 52);
        return [
          'memo:' + local + ' a owl:NamedIndividual, memo:VariantInstance ;',
          '  memo:variantTitle "' + title.replace(/"/g, '\\"') + '" ;',
          '  wdp:P361 memo:' + parent + ' .'
        ].join('\n');
      }

      function ensureTooltip() {
        if (!desktopHover || turtleTip) return;
        turtleTip = document.createElement('div');
        turtleTip.className = 'home-ttl-tooltip';
        document.body.appendChild(turtleTip);
      }

      function showTooltip(text, e) {
        if (!desktopHover) return;
        ensureTooltip();
        if (!turtleTip) return;
        turtleTip.textContent = text;
        turtleTip.style.display = 'block';
        moveTooltip(e || { clientX: mousePos.x, clientY: mousePos.y });
      }

      function moveTooltip(e) {
        if (!desktopHover || !turtleTip || turtleTip.style.display !== 'block') return;
        var pad = 12;
        var x = e.clientX + 16;
        var y = e.clientY + 16;
        var maxX = window.innerWidth - turtleTip.offsetWidth - pad;
        var maxY = window.innerHeight - turtleTip.offsetHeight - pad;
        turtleTip.style.left = Math.max(pad, Math.min(x, maxX)) + 'px';
        turtleTip.style.top = Math.max(pad, Math.min(y, maxY)) + 'px';
      }

      function hideTooltip() {
        if (turtleTip) turtleTip.style.display = 'none';
      }

      function refreshHoverAtMouse() {
        if (!desktopHover) return;
        if (!hasMousePos) return;

        moveTooltip({ clientX: mousePos.x, clientY: mousePos.y });

        var node = document.elementFromPoint(mousePos.x, mousePos.y);
        var tile = node ? node.closest('.home-tile') : null;

        if (!tile || !heroContainer.contains(tile)) {
          currentTile = null;
          hideTooltip();
          return;
        }

        if (currentTile !== tile) {
          currentTile = tile;
          showTooltip(tile.dataset.ttlSnippet || '', { clientX: mousePos.x, clientY: mousePos.y });
          return;
        }

        // Same tile, keep tooltip content in sync in case data changed during lazy append.
        if (turtleTip && turtleTip.style.display === 'block') {
          var nextText = tile.dataset.ttlSnippet || '';
          if (turtleTip.textContent !== nextText) {
            turtleTip.textContent = nextText;
          }
        }
      }

      function updateHoverFromPointer(e) {
        if (!desktopHover) return;
        mousePos.x = e.clientX;
        mousePos.y = e.clientY;
        hasMousePos = true;
        refreshHoverAtMouse();
      }

      function shuffle(arr) {
        var a = arr.slice();
        for (var i = a.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var tmp = a[i];
          a[i] = a[j];
          a[j] = tmp;
        }
        return a;
      }

      function tileSizeClass() {
        return 'home-tile';
      }

      function appendBatch() {
        if (isLoading || exhausted) return;
        isLoading = true;

        var limit = Math.min(cursor + BATCH, queue.length);
        for (var i = cursor; i < limit; i++) {
          var item = queue[i];
          var a = document.createElement('a');
          a.className = tileSizeClass(i);
          if (item.type === 'variant') {
            a.href = 'visualizations.html#variant/' + encodeURIComponent(item.photoId || item.slug || '');
          } else {
            a.href = 'visualizations.html#meme/' + encodeURIComponent(item.slug);
          }

          var img = document.createElement('img');
          img.src = item.imageURL || ('images_flat/' + item.imageFilename);
          img.alt = item.label || item.slug || '';
          img.loading = 'lazy';

          if (item.imageURL && item.imageFilename) {
            img.addEventListener('error', function() {
              if (this.dataset.fallbackTried) return;
              this.dataset.fallbackTried = '1';
              this.src = 'images_flat/' + this.dataset.fallbackFilename;
            });
            img.dataset.fallbackFilename = item.imageFilename;
          }

          if (desktopHover) {
            var snippet = item.type === 'variant'
              ? buildVariantSnippet(item)
              : buildMemeSnippet(item);
            a.dataset.ttlSnippet = snippet;
          }

          a.appendChild(img);
          a.dataset.key = item.type + ':' + (item.photoId || item.slug);

          var group = sortMode === 'year' ? (item.year || null)
            : sortMode === 'format' ? (item.format || null) : null;
          if (group && group !== lastGroupLabel) {
            var chip = document.createElement('span');
            chip.className = 'home-tile-label';
            chip.textContent = group;
            a.appendChild(chip);
          }
          lastGroupLabel = group;
          heroContainer.appendChild(a);
        }

        cursor = limit;
        if (cursor >= queue.length) exhausted = true;
        isLoading = false;
      }

      function buildQueue(memeData, variantData) {
        var memes = memeData && memeData.memes ? memeData.memes : {};
        var slugs = Object.keys(memes);
        var memeEntries = slugs
          .map(function(slug) {
            var m = memes[slug] || {};
            return {
              type: 'meme',
              slug: slug,
              label: slug.replace(/[-_]+/g, ' '),
              memoLocal: slug,
              year: /^\d{4}$/.test(String(m.year || '')) ? String(m.year) : null,
              format: (m.hasFormat || []).filter(function(f) { return f && f !== 'Unknown'; })[0] || null,
              imageFilename: m.imageFilename,
              imageURL: m.imageURL
            };
          })
          .filter(function(m) { return !!m.imageFilename; });

        var variants = Array.isArray(variantData) ? variantData : [];
        var variantEntries = variants
          .map(function(v) {
            return {
              type: 'variant',
              slug: v.folder || toMemoLocal(v.meme_name),
              photoId: v.photo_id,
              label: v.title || v.meme_name || ('Variant ' + (v.photo_id || '')),
              memoLocal: 'variant_' + (v.photo_id || ''),
              parentLocal: v.folder || toMemoLocal(v.meme_name),
              imageFilename: null,
              imageURL: v.image_url || ''
            };
          })
          .filter(function(v) { return !!v.imageURL; });

        return shuffle(memeEntries.concat(variantEntries));
      }

      /* Ticker: every meme format with its entry count, straight from the data */
      function buildTicker(memeData) {
        var el = document.getElementById('home-ticker');
        if (!el || !memeData || !memeData.memes) return;
        var counts = {};
        Object.keys(memeData.memes).forEach(function(slug) {
          (memeData.memes[slug].hasFormat || []).forEach(function(f) {
            if (f && f !== 'Unknown') counts[f] = (counts[f] || 0) + 1;
          });
        });
        el.innerHTML = Object.keys(counts).sort(function(a, b) { return counts[b] - counts[a]; })
          .map(function(f) { return '<span>' + f.toUpperCase() + ' <i>' + counts[f].toLocaleString() + '</i></span>✦'; })
          .join('');
      }

      function boot(allData) {
        var memeData = allData && allData[0] ? allData[0] : {};
        var variantData = allData && allData[1] ? allData[1] : [];
        var shuffledQueue = buildQueue(memeData, variantData);

        queue = shuffledQueue;
        buildTicker(memeData);
        allItems = shuffledQueue.slice();

        appendBatch();
        appendBatch();

        sentinelObs = new IntersectionObserver(function(entries) {
          entries.forEach(function(entry) {
            if (entry.isIntersecting) {
              appendBatch();
              if (exhausted) sentinelObs.disconnect();
            }
          });
        }, { rootMargin: '1100px 0px 1100px 0px' });
        sentinelObs.observe(sentinel);
      }

      /* ── Arrange: re-sort the collage with a FLIP animation ── */
      function hueOf(item) {
        var c = colours && colours[item.slug];
        if (!c) return 999;
        // push greys to the end so the spectrum reads cleanly
        return c.s < 12 ? 400 + (100 - c.l) : c.h;
      }
      function sortedItems(mode) {
        if (mode === 'shuffle') return shuffle(allItems);
        var memesOnly = allItems.filter(function(i) { return i.type === 'meme'; });
        var rest = shuffle(allItems.filter(function(i) { return i.type !== 'meme'; }));
        var key = mode === 'year' ? function(i) { return i.year || '9999'; }
          : mode === 'format' ? function(i) { return i.format || '~'; }
          : null;
        memesOnly.sort(mode === 'colour'
          ? function(a, b) { return hueOf(a) - hueOf(b); }
          : function(a, b) { var ka = key(a), kb = key(b); return ka < kb ? -1 : ka > kb ? 1 : 0; });
        return memesOnly.concat(rest);
      }
      function applySort(mode) {
        if (window.scrollY > 0) window.scrollTo(0, 0);
        var first = {};
        heroContainer.querySelectorAll('.home-tile').forEach(function(t) {
          var r = t.getBoundingClientRect();
          if (r.top < window.innerHeight * 2) first[t.dataset.key] = r;
        });
        sortMode = mode;
        lastGroupLabel = null;
        queue = sortedItems(mode);
        cursor = 0;
        exhausted = false;
        heroContainer.innerHTML = '';
        appendBatch();
        appendBatch();
        if (sentinelObs) { sentinelObs.disconnect(); sentinelObs.observe(sentinel); }
        var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduce) return;
        heroContainer.querySelectorAll('.home-tile').forEach(function(t, i) {
          var r = t.getBoundingClientRect();
          if (r.top > window.innerHeight * 1.5) return;
          var f = first[t.dataset.key];
          t.style.transition = 'none';
          if (f) {
            t.style.transform = 'translate(' + (f.left - r.left) + 'px,' + (f.top - r.top) + 'px)';
          } else {
            t.style.opacity = '0';
            t.style.transform = 'scale(.85)';
          }
          requestAnimationFrame(function() {
            requestAnimationFrame(function() {
              t.style.transition = 'transform .7s cubic-bezier(.2,.7,.2,1), opacity .5s ease ' + Math.min(i * 3, 400) + 'ms';
              t.style.transform = '';
              t.style.opacity = '';
            });
          });
        });
      }
      document.querySelectorAll('.collage-sort button').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var mode = btn.dataset.sort;
          document.querySelectorAll('.collage-sort button').forEach(function(b) {
            var on = b === btn;
            b.classList.toggle('active', on);
            b.setAttribute('aria-pressed', String(on));
          });
          if (mode === 'colour' && !colours) {
            btn.disabled = true;
            fetch('color_data.json').then(function(r) { return r.ok ? r.json() : {}; })
              .catch(function() { return {}; })
              .then(function(d) { colours = d; btn.disabled = false; applySort('colour'); });
            return;
          }
          applySort(mode);
        });
      });

      Promise.all([
        fetch('meme_data.json').then(function(r) {
          if (!r.ok) throw new Error('HTTP ' + r.status + ' for meme_data.json');
          return r.json();
        }),
        fetch('variants_metadata.json')
          .then(function(r) {
            if (!r.ok) return [];
            return r.json();
          })
          .catch(function() { return []; })
      ])
        .then(boot)
        .catch(function() {
          heroContainer.innerHTML = '<p style="grid-column:1 / -1; color:#666; font-size:.85rem; padding: 20px;">Unable to load collage data.</p>';
        });

      if (desktopHover) {
        document.addEventListener('mousemove', updateHoverFromPointer);
        window.addEventListener('scroll', refreshHoverAtMouse, { passive: true });
        window.addEventListener('resize', refreshHoverAtMouse, { passive: true });
        document.addEventListener('mouseleave', function() {
          currentTile = null;
          hasMousePos = false;
          hideTooltip();
        });
        window.addEventListener('blur', function() {
          currentTile = null;
          hasMousePos = false;
          hideTooltip();
        });
      }
    })();
  </script>
  <script src="memo_meme.js" defer></script>
</body>
